name: personal_life_rpg
description: "Personal Life RPG - Cyberpunk Gamified Life Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Networking
  dio: ^5.7.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  
  # Local Preferences
  shared_preferences: ^2.3.2
  
  # File Management
  path_provider: ^2.1.4
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # Fonts
  google_fonts: ^6.2.1
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/